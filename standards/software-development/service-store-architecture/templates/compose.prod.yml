services:
  app:
    container_name: ${PROJECT_NAME:-jp-service-store}-app-prod
    build:
      target: production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RUN_SEEDERS: "false"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    container_name: ${PROJECT_NAME:-jp-service-store}-web-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
    security_opt:
      - no-new-privileges:true

  db:
    profiles: ["local-production"]

volumes:
  app-storage:
  bootstrap-cache:
