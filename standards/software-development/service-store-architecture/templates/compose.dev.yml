services:
  app:
    container_name: ${PROJECT_NAME:-jp-service-store}-app-dev
    build:
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    volumes:
      - .:/var/www/html
      - composer-vendor:/var/www/html/vendor
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - composer-cache:/home/app/.composer/cache

  web:
    container_name: ${PROJECT_NAME:-jp-service-store}-web-dev
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  node:
    image: node:20-bookworm-slim
    container_name: ${PROJECT_NAME:-jp-service-store}-node-dev
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ${PROJECT_NAME:-jp-service-store}-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  composer-vendor:
  composer-cache:
  node-modules:
  app-storage:
  bootstrap-cache:
